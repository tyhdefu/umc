[package]
name = "umc-vm"
version = "0.1.0"
description = "Virtual Machine for Universal Machine Code"
edition = "2024"

[dependencies]
umc-model = { path = "../umc-model" }
umcc = { path = "../umcc" }

# Arbitrary manually controlled width integers
awint = {version = "0.18.1" }

# For Command line args parsing
clap = { version = "4.5.55", features = ["derive"]}
rustc-hash = "2.1.1"
int-enum = "1.2.0"

# for assembly emission to x86_64 and AArch64
iced-x86 = { version = "1.21", optional = true, default-features = false, features = ["std", "block_encoder", "decoder", "gas", "code_asm"] }
dynasmrt = { version = "5.1.0", optional = true }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[dev-dependencies]
yaxpeax-arch = "0.3"
yaxpeax-arm = "0.4"

[features]
default = ["jit"]
jit = ["dep:libc", "dep:iced-x86", "dep:dynasmrt"]


