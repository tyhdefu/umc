[package]
name = "umc-llvm"
version = "0.1.0"
description = "A LLVM IR to UMC translator"
edition = "2024"

[dependencies]
umc-model = { path = "../umc-model" }
umcc = { path = "../umcc" }
umc-vm = { path = "../umc-vm" }

# For Command line args parsing
clap = { version = "4.5.55", features = ["derive"]}
rustc-hash = "2.1.1"
int-enum = "1.2.0"

# For consumption of LLVM IR and conversion into Rust data types - commented out for now as it doesnt compile on windows
# llvm-ir = { version = "0.11.3", features = ["llvm-19"] }


