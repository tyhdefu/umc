[package]
name = "umc-llvm"
version = "0.1.0"
description = "A LLVM IR to UMC translator"
edition = "2024"

[dependencies]
umc-model = { path = "../umc-model" }
umcc = { path = "../umcc" }
umc-vm = { path = "../umc-vm" }

# For Command line args parsing
clap = { version = "4.5.55", features = ["derive"]}
rustc-hash = "2.1.1"
int-enum = "1.2.0"

# For consumption of LLVM IR and conversion into Rust data types.
# Linux only: llvm-sys needs a full LLVM 19 dev install (apt: llvm-19-dev libpolly-19-dev, LLVM_SYS_191_PREFIX=/usr/lib/llvm-19)
[target.'cfg(target_os = "linux")'.dependencies]
llvm-ir = { version = "0.11.3", features = ["llvm-19"] }
